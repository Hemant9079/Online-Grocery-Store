# =============================================================================
# FILE: aws/cloudformation/06-secrets-manager.yaml
# PURPOSE: Creates AWS Secrets Manager secrets to replace .env files.
#
# THE PROBLEM WITH .env FILES ON SERVERS:
#   Your current Jenkinsfile uses: --env-file /var/jenkins_home/secrets/grocery-backend.env
#   This file contains sensitive data (JWT secret, Razorpay keys, DB URI, etc.)
#   Problems: file can be accidentally committed, exposed in logs, hard to rotate.
#
# THE AWS WAY:
#   Store all secrets in AWS Secrets Manager — an encrypted, audited, versioned vault.
#   ECS automatically injects secrets as environment variables at container startup.
#   Your existing Node.js code continues to use process.env.MONGO_URI etc. — unchanged!
#
# HOW ECS READS SECRETS:
#   In 04-ecs-fargate.yaml, the Task Definition has a "secrets" section that maps
#   Secrets Manager keys → environment variable names.
#   ECS fetches secrets BEFORE starting the container. Node.js sees them as env vars.
#   No code changes needed in your existing Server/ files!
#
# IMPORTANT: After deployment, update the secret values in AWS Console!
#            The placeholder values below are NOT real — replace them!
#
# DEPLOY: aws cloudformation deploy
#         --template-file aws/cloudformation/06-secrets-manager.yaml
#         --stack-name grocery-secrets
# =============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Secrets Manager secrets for Online Grocery Store.
  Replaces Server/.env file. ECS reads these secrets and injects them
  as environment variables — your existing Node.js code is unchanged.

Parameters:

  ProjectName:
    Type: String
    Default: grocery-store

  # ─────────────────────────────────────────────────────────
  # REPLACE THESE PLACEHOLDER VALUES WITH YOUR REAL SECRETS
  # Option 1: Update this file (not recommended — git history)
  # Option 2: Deploy with empty values, then update in AWS Console
  # Option 3: Pass as parameters: --parameter-overrides MongoUri=xxx
  # ─────────────────────────────────────────────────────────

  MongoUri:
    Type: String
    NoEcho: true    # NoEcho = value is masked in CloudFormation console
    Default: 'mongodb+srv://hkumar954995_db_user:4IWJ42QWzrHBdSaz@glosary.zldc1cq.mongodb.net/?appName=Glosary'
    Description: >
      MongoDB Atlas connection string.
      Get from: MongoDB Atlas Console → Clusters → Connect → Connect your application.
      Format: mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/<dbname>

  JwtSecret:
    Type: String
    NoEcho: true
    Default: 'super_secret_key_123'
    Description: >
      JWT signing secret for access tokens.
      Generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      Get current value from your Server/.env file: JWT_SECRET

  JwtRefreshSecret:
    Type: String
    NoEcho: true
    Default: 'REPLACE_WITH_A_DIFFERENT_64_CHARACTER_RANDOM_STRING'   # ⚠️ NOT in .env — add JWT_REFRESH_SECRET to Server/.env and update this
    Description: >
      JWT signing secret for refresh tokens.
      Must be DIFFERENT from JwtSecret.
      ⚠️ JWT_REFRESH_SECRET was NOT found in Server/.env — please set this manually.

  RazorpayKeyId:
    Type: String
    NoEcho: true
    Default: 'rzp_test_SJ1piYlFgtlvBS'
    Description: >
      Razorpay Key ID (starts with rzp_test_ or rzp_live_).
      Get from: Razorpay Dashboard → Settings → API Keys.
      Use rzp_test_ for development, rzp_live_ for production.

  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: 'yQOhANVLSIwFlnxNuxnuQaKG'
    Description: >
      Razorpay Key Secret.
      Get from: Razorpay Dashboard → Settings → API Keys → Generate Key Secret.

  GoogleClientId:
    Type: String
    NoEcho: true
    Default: '282914855362-irks3hi5joe6h1ule6gat59p4nlo0mrj.apps.googleusercontent.com'
    Description: >
      Google OAuth 2.0 Client ID.
      Get from: Google Cloud Console → APIs & Services → Credentials.
      Your app uses @react-oauth/google which needs this.

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: 'REPLACE_WITH_GOOGLE_CLIENT_SECRET'   # ⚠️ NOT in .env — add GOOGLE_CLIENT_SECRET to Server/.env and update this
    Description: >
      Google OAuth 2.0 Client Secret.
      ⚠️ GOOGLE_CLIENT_SECRET was NOT found in Server/.env — get it from Google Cloud Console.

  EmailUser:
    Type: String
    NoEcho: true
    Default: 'hkumar954995@gmail.com'
    Description: >
      Email address for Nodemailer (sending order confirmations, OTPs).
      Your app uses nodemailer — this is the sender email address.
      Consider switching to AWS SES for better deliverability.

  EmailPass:
    Type: String
    NoEcho: true
    Default: 'buic ovur abep lenn'
    Description: >
      Email password or App Password for Nodemailer.
      For Gmail: use App Password (not your main Gmail password).
      Generate: Google Account → Security → 2-Step Verification → App passwords.

Resources:

  # ===========================================================================
  # KMS KEY — Custom encryption key for secrets
  # By default, Secrets Manager uses AWS-managed keys (free).
  # A custom KMS key gives more control over who can decrypt secrets.
  # This key is used to encrypt all grocery store secrets.
  # ===========================================================================
  SecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: >
        KMS key for encrypting Online Grocery Store secrets in Secrets Manager.
        Enables fine-grained control over who can access and decrypt secrets.
      EnableKeyRotation: true   # Auto-rotate the KMS key every year (best practice)
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Allow the AWS account to manage the key
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  # KMS Key Alias — human-readable name for the key
  SecretsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-secrets-key'
      TargetKeyId: !Ref SecretsKMSKey

  # ===========================================================================
  # SECRET 1: MongoDB Connection URI
  # Used by: Mongoose in Server/index.js (mongoose.connect(process.env.MONGO_URI))
  # ===========================================================================
  MongoDBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/mongo-uri'
      Description: >
        MongoDB Atlas connection string for the Online Grocery Store.
        Injected into ECS containers as: MONGO_URI environment variable.
        Used by Mongoose: mongoose.connect(process.env.MONGO_URI)
      KmsKeyId: !Ref SecretsKMSKey   # Encrypt with our custom KMS key
      # Store as JSON key-value pair (ECS can extract individual keys)
      SecretString: !Sub |
        {
          "MONGO_URI": "${MongoUri}"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: SecretType
          Value: Database

  # ===========================================================================
  # SECRET 2: JWT Signing Secrets
  # Used by: Server/middleware/auth.js (jwt.sign, jwt.verify)
  # Both access token and refresh token secrets stored together.
  # ===========================================================================
  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/jwt-secrets'
      Description: >
        JWT signing secrets for Online Grocery Store authentication.
        JWT_SECRET: used to sign/verify access tokens (short-lived, ~15min).
        JWT_REFRESH_SECRET: used to sign/verify refresh tokens (long-lived, ~7days).
        Both injected as environment variables in ECS tasks.
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "JWT_SECRET": "${JwtSecret}",
          "JWT_REFRESH_SECRET": "${JwtRefreshSecret}"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: SecretType
          Value: Authentication

  # ===========================================================================
  # SECRET 3: Razorpay Payment Gateway Keys
  # Used by: Server/controllers/paymentController.js (Razorpay SDK)
  # The razorpay npm package reads these to process payments.
  # ===========================================================================
  RazorpaySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/razorpay'
      Description: >
        Razorpay payment gateway API keys for Online Grocery Store.
        RAZORPAY_KEY_ID: Public key (also sent to frontend for payment widget).
        RAZORPAY_KEY_SECRET: Private key (NEVER send to frontend).
        Used by the 'razorpay' npm package to create/verify payment orders.
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "RAZORPAY_KEY_ID": "${RazorpayKeyId}",
          "RAZORPAY_KEY_SECRET": "${RazorpayKeySecret}"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: SecretType
          Value: PaymentGateway

  # ===========================================================================
  # SECRET 4: Google OAuth Credentials
  # Used by: Server (verify Google tokens from @react-oauth/google on frontend)
  # Frontend uses GOOGLE_CLIENT_ID, Backend verifies the token.
  # ===========================================================================
  GoogleOAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/google-oauth'
      Description: >
        Google OAuth 2.0 credentials for Online Grocery Store.
        GOOGLE_CLIENT_ID: Used by both frontend (@react-oauth/google) and backend.
        GOOGLE_CLIENT_SECRET: Used by backend to verify OAuth tokens.
        Frontend gets GOOGLE_CLIENT_ID via VITE_GOOGLE_CLIENT_ID build-time variable.
        Backend gets it via this secret at runtime.
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "GOOGLE_CLIENT_ID": "${GoogleClientId}",
          "GOOGLE_CLIENT_SECRET": "${GoogleClientSecret}"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: SecretType
          Value: OAuth

  # ===========================================================================
  # SECRET 5: Email Credentials (Nodemailer)
  # Used by: Server (nodemailer transport for order confirmations, OTPs)
  # The app uses nodemailer npm package to send emails.
  # TIP: Consider migrating to AWS SES — better deliverability, cheaper at scale.
  # ===========================================================================
  EmailSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/email'
      Description: >
        Email credentials for Nodemailer transactional email sending.
        EMAIL_USER: Gmail address or SMTP username.
        EMAIL_PASS: Gmail App Password or SMTP password.
        Used by nodemailer to send order confirmations, OTPs, welcome emails.
        Migration tip: Replace with AWS SES for better deliverability.
        SES setup: see aws/README.md section on email migration.
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "EMAIL_USER": "${EmailUser}",
          "EMAIL_PASS": "${EmailPass}"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: SecretType
          Value: Email

  # ===========================================================================
  # RESOURCE POLICY — Allows ECS Task Role to read these secrets
  # Without this, ECS cannot fetch the secrets even with the task role.
  # ===========================================================================
  MongoDBSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref MongoDBSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowECSTaskRead
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'

Outputs:

  MongoDBSecretArn:
    Description: >
      ARN of the MongoDB secret. Reference in ECS Task Definition (04-ecs-fargate.yaml).
      Used in: Secrets section, MONGO_URI variable mapping.
    Value: !Ref MongoDBSecret
    Export:
      Name: !Sub '${ProjectName}-MongoDBSecretArn'

  JWTSecretArn:
    Description: >
      ARN of the JWT secrets. Used in ECS Task Definition secrets mapping.
    Value: !Ref JWTSecret
    Export:
      Name: !Sub '${ProjectName}-JWTSecretArn'

  RazorpaySecretArn:
    Description: ARN of Razorpay credentials secret.
    Value: !Ref RazorpaySecret
    Export:
      Name: !Sub '${ProjectName}-RazorpaySecretArn'

  GoogleOAuthSecretArn:
    Description: ARN of Google OAuth credentials secret.
    Value: !Ref GoogleOAuthSecret
    Export:
      Name: !Sub '${ProjectName}-GoogleOAuthSecretArn'

  EmailSecretArn:
    Description: ARN of email/Nodemailer credentials secret.
    Value: !Ref EmailSecret
    Export:
      Name: !Sub '${ProjectName}-EmailSecretArn'

  SecretsKMSKeyId:
    Description: >
      KMS Key ID for secrets encryption.
      Use this when granting additional IAM roles access to decrypt secrets.
    Value: !Ref SecretsKMSKey
    Export:
      Name: !Sub '${ProjectName}-SecretsKMSKeyId'
